name: My First Workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  job1:
    name: Checkout and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "This is job 1 - Build step"

      - name: List files
        run: ls -la

  job2:
    name: Test
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "This is job 2 - Test step"

      - name: Run a fake test
        run: echo "Running tests... All passed!"